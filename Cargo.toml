[workspace]
resolver = "3"
members = [
    "apps/message-receiver",
    "apps/receipt-analyzer",
    "apps/response-service",
    "crates/aws",
    "crates/shared",
    "crates/external-api",
]

# 全クレートで共有するパッケージ設定
[workspace.package]
version = "0.1.0"
edition = "2024"

# 依存バージョンをworkspaceで一元管理する
[workspace.dependencies]
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
chrono = { version = "0.4.45", features = ["serde"] }
# 内部クレートもここで管理する
shared = { path = "crates/shared"}
aws = { path = "crates/aws"}
